; Copy this file to config.ini and fill in your values.
; config.ini is git-ignored (it holds your password).

[ble]
; Your pump's Bluetooth LE address (find it with:  bluetoothctl  -> scan le)
mac = AA:BB:CC:DD:EE:FF
adapter = hci0
; GATT path of the control characteristic on YOUR device. Find it with:
;   bluetoothctl -> connect <mac> -> menu gatt -> list-attributes
; It looks like serviceNNNN/charNNNN ; the agent builds the full /org/bluez/... path.
char = serviceXXXX/charYYYY

[web]
port = 8095
user = admin
pass = changeme
; anti-burst cache for /state, in seconds (skip a BLE read if the cached value is younger)
ttl = 30
